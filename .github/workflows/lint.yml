name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-lint:
    name: C/C++ syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install minimal ESP toolchain
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3

      - name: Reconfigure (no build)
        run: idf.py reconfigure

      - name: CMake-only build (no compile)
        run: |
          idf.py build --no-warnings-as-errors || true
        # Allow partial: we only want to confirm CMake configuration parses.
        # Actual firmware build is verified by the build workflow.

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            *.md
            **/*.md